<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1a17" />
    <meta name="description" content="Drop a photo of a mapped spot. Tessera finds where the photographer stood, the heading and the lens." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d2452c%22/%3E%3C/svg%3E" />
    <title>Tessera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the app script never arrives (a dropped request on flaky Wi-Fi), offer a reload instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.childElementCount) r.innerHTML = '<div style="min-height:100vh;display:grid;place-content:center;gap:12px;padding:32px;background:#1c1a17;color:#eee7d8;font:16px system-ui"><p>Tessera did not finish loading. The connection may have dropped.</p><p><button onclick="location.reload()" style="font:inherit;padding:8px 14px;border-radius:4px;border:1px solid #3a352e;background:transparent;color:inherit;cursor:pointer">Reload</button></p></div>';
      }, 12000);
    </script>
  </body>
</html>
